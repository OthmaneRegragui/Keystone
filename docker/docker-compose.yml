services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: keystone-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        # The bundled Postgres is optional: when POSTGRES_HOST points at an
        # external database the `db` profile is not enabled, and the server
        # simply connects there instead (see the POSTGRES_HOST comment below).
        required: false
    # Publish the API to the host on SERVER_PORT (default 3000). The container
    # always listens on port 3000; only the host-side port follows SERVER_PORT.
    ports:
      - "${SERVER_PORT:-3000}:3000"
    # Run the server as PID 1 via tini so zombie processes are reaped and
    # signals are forwarded correctly.
    init: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - ../.env
    environment:
      - KEYSTONE__SERVER__HOST=0.0.0.0
      - APP_ENV=production
      # Storage base directory INSIDE the container — read from .env
      # (STORAGE_LOCAL_PATHS), default /mnt/keystone/data. MUST be an absolute
      # path inside the container. Bucket files land at:
      #   $STORAGE_LOCAL_PATHS/<storage-path-slug>/<bucket-name>/<blake3-shards>
      # e.g. /mnt/keystone/data/test1/test1/fc/bd/<blake3-hash>
      - STORAGE_LOCAL_PATHS=${STORAGE_LOCAL_PATHS:-/mnt/keystone/data}
      # Database — every connection setting comes from .env. The server derives
      # the URL itself from POSTGRES_HOST/PORT/USER/PASSWORD/DB (via env_file)
      # and percent-encodes the password, so symbols like @ : / % just work.
      # POSTGRES_HOST is the switch:
      #   - "postgres" or unset -> use the bundled `postgres` service (profile
      #                             `db`, enabled automatically by docker-run.sh)
      #   - any other host      -> connect to an existing Postgres; the bundled
      #                            container is not started
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
    volumes:
      # Where files live OUTSIDE the container is set with DATA_HOST_PATH in .env
      # (only the mount source changes — the server always sees STORAGE_LOCAL_PATHS):
      #   - unset/empty     -> Docker named volume "storagedata" (default, hidden
      #                        on the host at
      #                        /var/lib/docker/volumes/<project>_storagedata/_data)
      #   - ./data          -> a real folder next to this project (docker-run.sh
      #                        anchors relative paths to the project root)
      #   - /any/abs/path   -> bind mount to that exact host path
      # To switch a running install, copy the old data into the new location once
      # (see README "Storage"), then set DATA_HOST_PATH and restart.
      - ${DATA_HOST_PATH:-storagedata}:${STORAGE_LOCAL_PATHS:-/mnt/keystone/data}

  # Optional "create one" Postgres: only started when the `db` profile is
  # enabled (docker-run.sh does that automatically when POSTGRES_HOST is unset
  # or "postgres"). With an external POSTGRES_HOST this service stays down.
  postgres:
    image: postgres:16-alpine
    container_name: keystone-postgres
    restart: unless-stopped
    profiles: ["db"]
    # Listen on POSTGRES_PORT inside the container too, so the port you set in
    # .env is the one the server connects to (it derives the URL from the same
    # var). Default 5432, matching the app's bare-metal default. Note: this only
    # affects the port — the pgdata volume holds no port settings, so changing
    # POSTGRES_PORT later is safe (unlike POSTGRES_PASSWORD).
    command:
      - postgres
      - -p
      - ${POSTGRES_PORT:-5432}
    environment:
      # Change these from the defaults in ../.env before going live — the
      # `server` service refuses to start in production with placeholder
      # JWT/encryption secrets, and a weak POSTGRES_PASSWORD would be exposed
      # on the published host port.
      - POSTGRES_USER=${POSTGRES_USER:-keystone}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-keystone}
      - POSTGRES_DB=${POSTGRES_DB:-keystone}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keystone} -d ${POSTGRES_DB:-keystone} -p ${POSTGRES_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Publish Postgres to the host on the same POSTGRES_PORT. Set POSTGRES_PORT
    # in ../.env (default 5433 in .env.example) if 5432 would collide with a
    # local Postgres.
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"

volumes:
  storagedata:
  pgdata:
