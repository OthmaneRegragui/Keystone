<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trash - Keystone</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <script defer src="/static/vendor/alpine.min.js"></script>
    <script src="/static/vendor/tailwind.min.js"></script>
    <link rel="stylesheet" href="/static/app-theme.css?v=__KEYSTONE_VERSION__">
    <style>
        [x-cloak] { display: none !important; }
    </style>
    <script>
        (function() {
            var savedTheme = null;
            try { savedTheme = localStorage.getItem('theme'); } catch (e) {}
            var dark = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (dark) document.documentElement.classList.add('dark');
        })();
        function clearAuth() {
            try { localStorage.removeItem('token'); } catch (e) {}
            try { localStorage.removeItem('refresh_token'); } catch (e) {}
            try { localStorage.removeItem('user'); } catch (e) {}
        }
        (function() {
            var token = null;
            try { token = localStorage.getItem('token'); } catch (e) {}
            if (!token) { window.location.href = '/login'; return; }
            try {
                var payload = JSON.parse(atob(token.split('.')[1]));
                var now = Math.floor(Date.now() / 1000);
                if (payload.exp && payload.exp < now) {
                    clearAuth();
                    window.location.href = '/login';
                }
            } catch (e) { clearAuth(); window.location.href = '/login'; }
        })();
    </script>
</head>
<body class="h-full bg-gray-50">
    <div class="flex h-full" x-data="sidebar()" x-on:keydown.escape.window="closeSidebar()">
        <div x-show="sidebarOpen" x-cloak class="fixed inset-0 z-30 bg-black/40 lg:hidden" x-on:click="closeSidebar()" style="display:none;"></div>
        <aside class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-gray-200 flex flex-col shrink-0 transition-transform duration-200 ease-in-out lg:static lg:translate-x-0"
            :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
            <div class="p-6 border-b border-gray-200">
                <h1 class="flex items-center gap-2 text-xl font-bold text-gray-900"><img src="/logo.svg" alt="Keystone logo" class="w-7 h-7 shrink-0">Keystone</h1>
            </div>
            <nav class="flex-1 p-4 space-y-1">
                <a href="/" x-on:click="closeSidebar()" :class="active('/') ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-gray-600 hover:bg-gray-50'" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Dashboard
                </a>
                <a href="/files" x-on:click="closeSidebar()" :class="active('/files') ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-gray-600 hover:bg-gray-50'" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                    Files
                </a>
                <a href="/trash" x-on:click="closeSidebar()" :class="active('/trash') ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-gray-600 hover:bg-gray-50'" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    Trash
                </a>
                <a href="/account" x-on:click="closeSidebar()" :class="active('/account') ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-gray-600 hover:bg-gray-50'" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    Account
                </a>
                    <a href="/bots" x-on:click="closeSidebar()" :class="active('/bots') ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-gray-600 hover:bg-gray-50'" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9z"/></svg>
                        Bots
                    </a>
                <template x-if="user && user.role === 'admin'">
                    <a href="/admin?page=overview" x-on:click="closeSidebar()" :class="active('/admin') ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-gray-600 hover:bg-gray-50'" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        Admin
                    </a>
                </template>
                <template x-if="user && user.role === 'admin'">
                    <a href="/docs" x-on:click="closeSidebar()" :class="active('/docs') ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-gray-600 hover:bg-gray-50'" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                        Documentation
                    </a>
                </template>
            </nav>
            <div class="p-4 border-t border-gray-200 space-y-3">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-700 font-medium text-sm" x-text="userInitial"></div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-gray-900 truncate" x-text="userName"></p>
                        <p class="text-xs text-gray-400 truncate" x-text="userEmail"></p>
                    </div>
                </div>
                <div class="flex items-center justify-between px-1">
                    <span class="text-sm text-gray-600 flex items-center gap-2">
                        <svg x-show="!themeDark" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                        <svg x-show="themeDark" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                        <span x-text="themeDark ? 'Dark mode' : 'Light mode'"></span>
                    </span>
                    <button x-on:click="toggleTheme()" role="switch" :aria-checked="themeDark"
                        :class="themeDark ? 'bg-indigo-600' : 'bg-gray-300'"
                        class="relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none">
                        <span :class="themeDark ? 'translate-x-4' : 'translate-x-0'"
                            class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
                    </button>
                </div>
                <button x-on:click="closeSidebar(); logout()" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-red-600 hover:bg-red-50 transition">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Sign Out
                </button>
                <div class="px-1 pt-1 text-xs text-gray-400">Keystone v__KEYSTONE_VERSION__</div>
            </div>
        </aside>

        <main class="flex-1 overflow-hidden flex flex-col bg-gray-50" x-data="trashPage()"
            x-on:keydown.escape.window="closeCtx()" x-on:click.window="closeCtx()">

            <!-- ═══ Toolbar ═══ -->
            <div class="relative z-30 bg-white border-b border-gray-200 px-4 py-2.5 shrink-0">
                <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                    <!-- Mobile sidebar toggle -->
                    <button x-on:click="toggleSidebar()" class="lg:hidden p-1.5 -ml-1.5 rounded-lg text-gray-500 hover:bg-gray-100 transition" aria-label="Toggle navigation menu">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <!-- Trash icon + page title -->
                    <div class="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-lg px-3 py-1.5 text-sm shrink-0">
                        <svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        <!-- Bucket selector -->
                        <div class="relative" x-data="{ open: false }">
                            <button x-on:click.stop="open = !open" class="flex items-center gap-1 px-1.5 py-0.5 rounded hover:bg-gray-200 transition font-medium text-gray-700">
                                <span x-text="selectedBucket || 'All buckets'"></span>
                                <svg class="w-3 h-3 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                            </button>
                            <div x-show="open" x-on:click.away="open = false" x-cloak
                                x-transition:enter="transition ease-out duration-100"
                                x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                                x-transition:leave="transition ease-in duration-75"
                                x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
                                class="absolute left-0 mt-1 w-56 bg-white rounded-xl shadow-xl border border-gray-200 py-1.5 z-50"
                                style="display:none;">
                                <button x-on:click="selectBucket(null); open = false"
                                    class="w-full flex items-center gap-3 px-3 py-2 text-sm transition"
                                    :class="!selectedBucket ? 'text-indigo-700 bg-indigo-50 font-medium' : 'text-gray-700 hover:bg-gray-50'">
                                    <svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                                    <span class="flex-1 min-w-0 truncate text-left">All buckets</span>
                                </button>
                                <template x-for="b in buckets" :key="b.name">
                                    <button x-on:click="selectBucket(b.name); open = false"
                                        class="w-full flex items-center gap-3 px-3 py-2 text-sm transition"
                                        :class="selectedBucket === b.name ? 'text-indigo-700 bg-indigo-50 font-medium' : 'text-gray-700 hover:bg-gray-50'">
                                        <svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z"/></svg>
                                        <span class="flex-1 min-w-0 truncate text-left" x-text="b.name"></span>
                                    </button>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- Toolbar Actions -->
                    <div class="flex items-center gap-1.5 shrink-0 flex-wrap">
                        <!-- View Toggle -->
                        <div class="flex items-center bg-gray-100 rounded-lg p-0.5">
                            <button x-on:click="viewMode = 'list'" :class="viewMode === 'list' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-400 hover:text-gray-600'" class="p-1.5 rounded-md transition" title="List view">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                            </button>
                            <button x-on:click="viewMode = 'grid'" :class="viewMode === 'grid' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-400 hover:text-gray-600'" class="p-1.5 rounded-md transition" title="Grid view">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/></svg>
                            </button>
                        </div>
                        <!-- Search -->
                        <div class="relative">
                            <svg class="w-4 h-4 text-gray-400 absolute left-2.5 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            <input type="text" placeholder="Search trash..."
                                x-model="searchInput" x-on:keydown.enter="doSearch()"
                                class="w-full sm:w-48 rounded-lg border border-gray-200 bg-gray-50 pl-8 pr-2 py-1.5 text-sm focus:bg-white focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 transition">
                        </div>
                        <!-- Item count -->
                        <span class="text-sm text-gray-400 hidden sm:inline" x-text="filteredCount() + ' item' + (filteredCount() === 1 ? '' : 's')"></span>
                    </div>
                </div>
            </div>

            <!-- ═══ Content Area ═══ -->
            <div class="flex-1 overflow-auto" x-on:scroll.capture="closeCtx()">

                <!-- Loading -->
                <div x-show="loading" class="p-12 text-center text-gray-400">
                    <svg class="w-6 h-6 mx-auto mb-2 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                    <p class="text-sm">Loading...</p>
                </div>

                <!-- Empty State -->
                <div x-show="!loading && filteredFolders().length === 0 && filteredFiles().length === 0" class="h-full flex items-center justify-center text-gray-400">
                    <div class="text-center">
                        <svg class="w-16 h-16 mx-auto mb-3 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        <p x-show="allFolders.length === 0 && allFiles.length === 0" class="font-medium text-gray-600 mb-1">Trash is empty</p>
                        <p x-show="allFolders.length === 0 && allFiles.length === 0" class="text-sm text-gray-400">Deleted files and folders will appear here</p>
                        <p x-show="allFolders.length > 0 || allFiles.length > 0" class="font-medium text-gray-600 mb-1">No items match your filter</p>
                        <p x-show="allFolders.length > 0 || allFiles.length > 0" class="text-sm text-gray-400">Try selecting a different bucket</p>
                        <a x-show="allFolders.length === 0 && allFiles.length === 0" href="/files" class="mt-6 inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z"/></svg>
                            Browse Files
                        </a>
                    </div>
                </div>

                <!-- ═══ LIST VIEW ═══ -->
                <div x-show="!loading && viewMode === 'list' && (filteredFolders().length > 0 || filteredFiles().length > 0)">
                    <table class="w-full text-sm">
                        <thead class="sticky top-0 z-10 bg-gray-50 border-b border-gray-200">
                            <tr class="text-left text-gray-500">
                                <th class="px-4 py-2 font-medium w-[40%]">Name</th>
                                <th class="px-4 py-2 font-medium w-[12%] hidden md:table-cell">Size</th>
                                <th class="px-4 py-2 font-medium w-[15%] hidden md:table-cell">Bucket</th>
                                <th class="px-4 py-2 font-medium w-[18%] hidden md:table-cell">Deleted</th>
                                <th class="px-4 py-2 font-medium text-right w-[15%]">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <!-- Tree rows (folders nested inside folders, files inside their folder) -->
                            <template x-for="row in treeRows" :key="row.key">
                                <tr class="hover:bg-indigo-50/50 group transition-colors"
                                    x-on:contextmenu.prevent="openCtx($event, row.kind, row.item)">
                                    <td class="px-4 py-2.5">
                                        <div class="flex items-center gap-2" :style="'padding-left:' + (row.depth * 22) + 'px'">
                                            <!-- Expand/collapse chevron -->
                                            <button x-show="row.kind === 'folder' && hasChildren(row.item.folder_id)"
                                                x-on:click.stop="toggleCollapse(row.item.folder_id)" title="Expand / collapse"
                                                class="p-0.5 rounded text-gray-400 hover:text-gray-700 hover:bg-gray-200 transition shrink-0">
                                                <svg class="w-3.5 h-3.5 transition-transform" :class="collapsed[row.item.folder_id] ? '' : 'rotate-90'" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                                            </button>
                                            <span x-show="!(row.kind === 'folder' && hasChildren(row.item.folder_id))" class="w-[18px] shrink-0"></span>

                                            <template x-if="row.kind === 'folder'">
                                                <div class="flex items-center gap-3 min-w-0">
                                                    <svg class="w-5 h-5 text-amber-500 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
                                                    <span class="font-medium text-gray-900 truncate" x-text="row.item.name"></span>
                                                </div>
                                            </template>
                                            <template x-if="row.kind === 'file'">
                                                <div class="flex items-center gap-3 min-w-0">
                                                    <div class="w-7 h-7 rounded flex items-center justify-center text-[10px] font-bold shrink-0"
                                                        :class="{
                                                            'bg-blue-100 text-blue-600': fileIcon(row.item.mime_type) === 'image',
                                                            'bg-purple-100 text-purple-600': fileIcon(row.item.mime_type) === 'video',
                                                            'bg-green-100 text-green-600': fileIcon(row.item.mime_type) === 'text',
                                                            'bg-red-100 text-red-600': fileIcon(row.item.mime_type) === 'pdf',
                                                            'bg-yellow-100 text-yellow-600': fileIcon(row.item.mime_type) === 'archive',
                                                            'bg-gray-100 text-gray-500': fileIcon(row.item.mime_type) === 'file' || fileIcon(row.item.mime_type) === 'audio'
                                                        }">
                                                        <span x-text="fileExtTag(row.item.name, 3)"></span>
                                                    </div>
                                                    <span class="font-medium text-gray-900 truncate" x-text="row.item.name"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </td>
                                    <td class="px-4 py-2.5 text-gray-400 text-xs hidden md:table-cell">
                                        <span x-show="row.kind === 'folder'">Folder</span>
                                        <span x-show="row.kind === 'file'" x-text="fmtBytes(row.item.size)"></span>
                                    </td>
                                    <td class="px-4 py-2.5 text-gray-500 text-xs hidden md:table-cell" x-text="row.item.bucket_name || (row.kind === 'file' ? 'default' : '')"></td>
                                    <td class="px-4 py-2.5 text-gray-400 text-xs hidden md:table-cell" x-text="formatDate(row.item.deleted_at)"></td>
                                    <td class="px-4 py-2.5 text-right">
                                        <div class="flex items-center justify-end gap-1 opacity-0 group-hover:opacity-100 focus-within:opacity-100 row-actions transition">
                                            <template x-if="row.kind === 'folder'">
                                                <div class="flex items-center gap-1">
                                                    <button x-on:click="restoreFolder(row.item.folder_id, row.item.name)" title="Restore"
                                                        class="p-1 rounded hover:bg-white text-gray-400 hover:text-green-600 transition">
                                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
                                                    </button>
                                                    <button x-on:click="permanentDeleteFolder(row.item.folder_id, row.item.name)" title="Delete permanently"
                                                        class="p-1 rounded hover:bg-white text-gray-400 hover:text-red-600 transition">
                                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                                    </button>
                                                </div>
                                            </template>
                                            <template x-if="row.kind === 'file'">
                                                <div class="flex items-center gap-1">
                                                    <button x-on:click="restoreFile(row.item.user_file_id, row.item.name)" title="Restore"
                                                        class="p-1 rounded hover:bg-white text-gray-400 hover:text-green-600 transition">
                                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
                                                    </button>
                                                    <button x-on:click="permanentDeleteFile(row.item.user_file_id, row.item.name)" title="Delete permanently"
                                                        class="p-1 rounded hover:bg-white text-gray-400 hover:text-red-600 transition">
                                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                                    </button>
                                                </div>
                                            </template>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- ═══ GRID VIEW ═══ -->
                <div x-show="!loading && viewMode === 'grid' && (filteredFolders().length > 0 || filteredFiles().length > 0)" class="p-6">
                    <!-- Folders grid -->
                    <div x-show="filteredFolders().length > 0" class="mb-6">
                        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Folders</h3>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
                            <template x-for="f in filteredFolders()" :key="'gf-'+f.folder_id">
                                <div class="group bg-white rounded-xl border border-gray-200 p-4 hover:border-indigo-300 hover:shadow-sm transition cursor-pointer relative"
                                    x-on:contextmenu.prevent="openCtx($event, 'folder', f)">
                                    <div class="flex flex-col items-center text-center">
                                        <svg class="w-10 h-10 text-amber-400 mb-2" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
                                        <p class="text-sm font-medium text-gray-900 truncate w-full" x-text="f.name"></p>
                                        <p class="text-xs text-gray-400 mt-1" x-text="f.bucket_name"></p>
                                    </div>
                                    <div class="absolute top-2 right-2 flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition">
                                        <button x-on:click.stop="restoreFolder(f.folder_id, f.name)" title="Restore"
                                            class="p-1 rounded bg-white/80 backdrop-blur text-gray-400 hover:text-green-600 hover:bg-green-50 transition">
                                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
                                        </button>
                                        <button x-on:click.stop="permanentDeleteFolder(f.folder_id, f.name)" title="Delete permanently"
                                            class="p-1 rounded bg-white/80 backdrop-blur text-gray-400 hover:text-red-600 hover:bg-red-50 transition">
                                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                    <!-- Files grid -->
                    <div x-show="filteredFiles().length > 0">
                        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Files</h3>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
                            <template x-for="f in filteredFiles()" :key="'gf-'+f.user_file_id">
                                <div class="group bg-white rounded-xl border border-gray-200 p-4 hover:border-indigo-300 hover:shadow-sm transition cursor-pointer relative"
                                    x-on:contextmenu.prevent="openCtx($event, 'file', f)">
                                    <div class="flex flex-col items-center text-center">
                                        <div class="w-12 h-12 rounded-lg flex items-center justify-center text-sm font-bold mb-2"
                                            :class="{
                                                'bg-blue-100 text-blue-600': fileIcon(f.mime_type) === 'image',
                                                'bg-purple-100 text-purple-600': fileIcon(f.mime_type) === 'video',
                                                'bg-green-100 text-green-600': fileIcon(f.mime_type) === 'text',
                                                'bg-red-100 text-red-600': fileIcon(f.mime_type) === 'pdf',
                                                'bg-yellow-100 text-yellow-600': fileIcon(f.mime_type) === 'archive',
                                                'bg-gray-100 text-gray-500': fileIcon(f.mime_type) === 'file' || fileIcon(f.mime_type) === 'audio'
                                            }">
                                            <span x-text="fileExtTag(f.name, 4)"></span>
                                        </div>
                                        <p class="text-sm font-medium text-gray-900 truncate w-full" x-text="f.name"></p>
                                        <p class="text-xs text-gray-400 mt-1" x-text="fmtBytes(f.size)"></p>
                                    </div>
                                    <div class="absolute top-2 right-2 flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition">
                                        <button x-on:click.stop="restoreFile(f.user_file_id, f.name)" title="Restore"
                                            class="p-1 rounded bg-white/80 backdrop-blur text-gray-400 hover:text-green-600 hover:bg-green-50 transition">
                                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
                                        </button>
                                        <button x-on:click.stop="permanentDeleteFile(f.user_file_id, f.name)" title="Delete permanently"
                                            class="p-1 rounded bg-white/80 backdrop-blur text-gray-400 hover:text-red-600 hover:bg-red-50 transition">
                                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right-click context menu -->
            <div x-show="ctxOpen" x-cloak
                class="fixed z-[70] w-48 bg-white rounded-xl shadow-xl border border-gray-200 py-1.5"
                :style="'left:' + ctxX + 'px; top:' + ctxY + 'px;'"
                x-on:contextmenu.prevent>
                <template x-if="ctxItem">
                    <div>
                        <div class="px-3 py-1.5 text-xs font-medium text-gray-400 truncate border-b border-gray-100 mb-1" x-text="ctxItem.name"></div>
                        <button x-on:click="ctxRestore()"
                            class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 transition">
                            <svg class="w-4 h-4 text-green-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
                            Restore
                        </button>
                        <button x-on:click="ctxDelete()"
                            class="w-full flex items-center gap-3 px-3 py-2 text-sm text-red-600 hover:bg-red-50 transition">
                            <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            Delete permanently
                        </button>
                    </div>
                </template>
            </div>

            <!-- Toast notification -->
            <div x-show="toast" x-cloak x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0"
                x-transition:leave="transition ease-in duration-200"
                x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 translate-y-4"
                class="fixed bottom-6 right-6 z-50 bg-gray-900 text-white px-4 py-3 rounded-lg shadow-lg text-sm flex items-center gap-2"
                style="display:none;">
                <svg x-show="toastType === 'success'" class="w-4 h-4 text-green-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                <svg x-show="toastType === 'error'" class="w-4 h-4 text-red-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                <span x-text="toastMsg"></span>
            </div>
        </main>
    </div>

    <script>
        function sidebar() {
            var u = null;
            try { u = JSON.parse(localStorage.getItem('user') || 'null'); } catch (e) { u = null; }
            return {
                user: u,
                userName: u ? u.username : '',
                userEmail: u ? u.email : '',
                userInitial: u && u.username ? u.username.charAt(0).toUpperCase() : '?',
                active: function(p) { return window.location.pathname === p; },
                logout: function() {
                    try { fetch('/auth/logout', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' }); } catch (e) {}
                    clearAuth();
                    window.location.href = '/login';
                },
                themeDark: document.documentElement.classList.contains('dark'),
                toggleTheme: function() {
                    this.themeDark = !this.themeDark;
                    document.documentElement.classList.toggle('dark', this.themeDark);
                    try { localStorage.setItem('theme', this.themeDark ? 'dark' : 'light'); } catch (e) {}
                },
                sidebarOpen: false,
                toggleSidebar: function() { this.sidebarOpen = !this.sidebarOpen; },
                closeSidebar: function() { this.sidebarOpen = false; }
            };
        }

        function fmtBytes(b) {
            var n = Number(b);
            if (!Number.isFinite(n) || n <= 0) return '0 B';
            var u = ['B','KB','MB','GB','TB'];
            var i = Math.min(Math.floor(Math.log(n) / Math.log(1024)), u.length - 1);
            return (n / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + u[i];
        }

        function trashPage() {
            return {
                loading: true,
                allFolders: [],
                allFiles: [],
                buckets: [],
                selectedBucket: null,
                viewMode: 'list',
                searchInput: '',
                search: '',
                toast: false,
                toastMsg: '',
                toastType: 'success',
                treeRows: [],
                collapsed: {},
                childCounts: {},
                fileCounts: {},
                ctxOpen: false,
                ctxX: 0,
                ctxY: 0,
                ctxKind: 'file',
                ctxItem: null,
                init: function() { this.loadBuckets(); },
                authFetch: function(url, opts) {
                    var token = null;
                    try { token = localStorage.getItem('token'); } catch (e) {}
                    opts = opts || {};
                    opts.headers = Object.assign(opts.headers || {}, { 'Authorization': 'Bearer ' + token });
                    return fetch(url, opts).then(function(res) {
                        if (res.status === 401) { clearAuth(); window.location.href = '/login'; }
                        return res;
                    });
                },
                loadBuckets: function() {
                    var self = this;
                    self.authFetch('/api/buckets').then(function(r) { return r.json(); }).then(function(d) {
                        self.buckets = Array.isArray(d) ? d : [];
                        self.loadTrash();
                    }).catch(function() { self.loadTrash(); });
                },
                selectBucket: function(name) {
                    this.selectedBucket = name;
                    try { localStorage.setItem('selectedTrashBucket', name || ''); } catch (e) {}
                    this.refreshTree();
                },
                loadTrash: function() {
                    var self = this;
                    self.loading = true;
                    self.authFetch('/api/trash')
                        .then(function(r) { return r.json(); })
                        .then(function(d) {
                            self.allFolders = d.folders || [];
                            self.allFiles = d.files || [];
                            self.loading = false;
                            self.refreshTree();
                        })
                        .catch(function() { self.loading = false; });
                },
                // Rebuild the hierarchical view: folders nested in their deleted
                // parent folder, files inside the folder they were deleted with.
                refreshTree: function() {
                    var self = this;
                    var folderIds = {};
                    self.allFolders.forEach(function(f) { folderIds[f.folder_id] = true; });

                    var childFolders = {}, fileLists = {};
                    var childCounts = {}, fileCounts = {};
                    var rootFolders = [], rootFiles = [];

                    self.filteredFolders().forEach(function(f) {
                        if (f.parent_id && folderIds[f.parent_id]) {
                            if (!childFolders[f.parent_id]) childFolders[f.parent_id] = [];
                            childFolders[f.parent_id].push(f);
                        } else {
                            rootFolders.push(f);
                        }
                    });
                    Object.keys(childFolders).forEach(function(pid) { childCounts[pid] = childFolders[pid].length; });

                    self.filteredFiles().forEach(function(uf) {
                        if (uf.folder_id && folderIds[uf.folder_id]) {
                            if (!fileLists[uf.folder_id]) fileLists[uf.folder_id] = [];
                            fileLists[uf.folder_id].push(uf);
                        } else {
                            rootFiles.push(uf);
                        }
                    });
                    Object.keys(fileLists).forEach(function(fid) { fileCounts[fid] = fileLists[fid].length; });

                    var byDeletedDesc = function(a, b) {
                        var ta = new Date(a.deleted_at).getTime() || 0;
                        var tb = new Date(b.deleted_at).getTime() || 0;
                        return tb - ta;
                    };
                    var collapsed = self.collapsed;
                    var rows = [];
                    var pushFolder = function(f, depth) {
                        rows.push({ key: 'tf-' + f.folder_id, kind: 'folder', item: f, depth: depth });
                        if (collapsed[f.folder_id]) return;
                        (childFolders[f.folder_id] || []).slice().sort(byDeletedDesc)
                            .forEach(function(c) { pushFolder(c, depth + 1); });
                        (fileLists[f.folder_id] || []).slice().sort(byDeletedDesc)
                            .forEach(function(uf) { rows.push({ key: 'ff-' + uf.user_file_id, kind: 'file', item: uf, depth: depth + 1 }); });
                    };
                    rootFolders.slice().sort(byDeletedDesc).forEach(function(f) { pushFolder(f, 0); });
                    rootFiles.slice().sort(byDeletedDesc).forEach(function(uf) { rows.push({ key: 'ff-' + uf.user_file_id, kind: 'file', item: uf, depth: 0 }); });

                    self.childCounts = childCounts;
                    self.fileCounts = fileCounts;
                    self.treeRows = rows;
                },
                hasChildren: function(folderId) {
                    return ((this.childCounts[folderId] || 0) + (this.fileCounts[folderId] || 0)) > 0;
                },
                toggleCollapse: function(folderId) {
                    if (this.collapsed[folderId]) delete this.collapsed[folderId];
                    else this.collapsed[folderId] = true;
                    this.refreshTree();
                },
                openCtx: function(e, kind, item) {
                    this.ctxKind = kind;
                    this.ctxItem = item;
                    var pad = 8, w = 192, h = 110;
                    var x = e.clientX, y = e.clientY;
                    if (x + w + pad > window.innerWidth) x = window.innerWidth - w - pad;
                    if (y + h + pad > window.innerHeight) y = window.innerHeight - h - pad;
                    this.ctxX = Math.max(pad, x);
                    this.ctxY = Math.max(pad, y);
                    this.ctxOpen = true;
                },
                closeCtx: function() { this.ctxOpen = false; },
                ctxRestore: function() {
                    if (!this.ctxItem) return;
                    if (this.ctxKind === 'folder') this.restoreFolder(this.ctxItem.folder_id, this.ctxItem.name);
                    else this.restoreFile(this.ctxItem.user_file_id, this.ctxItem.name);
                    this.closeCtx();
                },
                ctxDelete: function() {
                    if (!this.ctxItem) return;
                    if (this.ctxKind === 'folder') this.permanentDeleteFolder(this.ctxItem.folder_id, this.ctxItem.name);
                    else this.permanentDeleteFile(this.ctxItem.user_file_id, this.ctxItem.name);
                    this.closeCtx();
                },
                filteredFolders: function() {
                    var self = this;
                    var list = self.allFolders;
                    if (self.selectedBucket) {
                        list = list.filter(function(f) { return f.bucket_name === self.selectedBucket; });
                    }
                    if (self.search) {
                        var q = self.search.toLowerCase();
                        list = list.filter(function(f) { return f.name.toLowerCase().indexOf(q) !== -1; });
                    }
                    return list;
                },
                filteredFiles: function() {
                    var self = this;
                    var list = self.allFiles;
                    if (self.selectedBucket) {
                        list = list.filter(function(f) { return (f.bucket_name || 'default') === self.selectedBucket; });
                    }
                    if (self.search) {
                        var q = self.search.toLowerCase();
                        list = list.filter(function(f) { return f.name.toLowerCase().indexOf(q) !== -1; });
                    }
                    return list;
                },
                filteredCount: function() {
                    return this.filteredFolders().length + this.filteredFiles().length;
                },
                doSearch: function() { this.search = this.searchInput; this.refreshTree(); },
                formatDate: function(iso) {
                    if (!iso) return '';
                    var d = new Date(iso);
                    if (isNaN(d.getTime())) return '';
                    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                },
                fileIcon: function(mime) {
                    if (!mime) return 'file';
                    if (mime.startsWith('image/')) return 'image';
                    if (mime.startsWith('video/')) return 'video';
                    if (mime.startsWith('audio/')) return 'audio';
                    if (mime.includes('pdf')) return 'pdf';
                    if (mime.includes('zip') || mime.includes('tar') || mime.includes('gz') || mime.includes('rar') || mime.includes('7z')) return 'archive';
                    if (mime.includes('text') || mime.includes('json') || mime.includes('xml')) return 'text';
                    return 'file';
                },
                fileExtTag: function(name, max) {
                    if (!name) return '';
                    var parts = name.split('.');
                    if (parts.length < 2) return '';
                    var ext = parts.pop().toUpperCase();
                    return ext.substring(0, max || 3);
                },
                showToast: function(msg, type) {
                    var self = this;
                    self.toastMsg = msg;
                    self.toastType = type || 'success';
                    self.toast = true;
                    setTimeout(function() { self.toast = false; }, 3000);
                },
                restoreFile: function(id, name) {
                    var self = this;
                    self.authFetch('/api/trash/file/' + id + '/restore', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({})
                    }).then(function(r) {
                        if (!r.ok) throw new Error('Restore failed');
                        return r.json();
                    }).then(function() {
                        self.showToast('"' + name + '" restored');
                        self.loadTrash();
                    }).catch(function() { self.showToast('Restore failed', 'error'); });
                },
                restoreFolder: function(id, name) {
                    var self = this;
                    self.authFetch('/api/trash/folder/' + id + '/restore', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({})
                    }).then(function(r) {
                        if (!r.ok) throw new Error('Restore failed');
                        return r.json();
                    }).then(function() {
                        self.showToast('"' + name + '" restored');
                        self.loadTrash();
                    }).catch(function() { self.showToast('Restore failed', 'error'); });
                },
                permanentDeleteFile: function(id, name) {
                    var self = this;
                    if (!confirm('Permanently delete "' + name + '"?\n\nThis cannot be undone.')) return;
                    self.authFetch('/api/trash/file/' + id, { method: 'DELETE' })
                        .then(function(r) {
                            if (!r.ok) throw new Error('Delete failed');
                            return r.json();
                        }).then(function() {
                            self.showToast('"' + name + '" permanently deleted');
                            self.loadTrash();
                        }).catch(function() { self.showToast('Delete failed', 'error'); });
                },
                permanentDeleteFolder: function(id, name) {
                    var self = this;
                    if (!confirm('Permanently delete folder "' + name + '" and ALL its contents?\n\nThis cannot be undone.')) return;
                    self.authFetch('/api/trash/folder/' + id, { method: 'DELETE' })
                        .then(function(r) {
                            if (!r.ok) throw new Error('Delete failed');
                            return r.json();
                        }).then(function() {
                            self.showToast('"' + name + '" permanently deleted');
                            self.loadTrash();
                        }).catch(function() { self.showToast('Delete failed', 'error'); });
                }
            };
        }
    </script>
</body>
</html>
