<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Keystone</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <script defer src="/static/vendor/alpine.min.js"></script>
    <script src="/static/vendor/tailwind.min.js"></script>
    <style>
                html:not(.dark) { color-scheme: light; }
        html.dark { color-scheme: dark; }
        html.dark body { background-color: #131316 !important; }
        html.dark .bg-gray-50 { background-color: #131316 !important; }
        html.dark .bg-white { background-color: #1a1a1f !important; }
        html.dark .bg-gray-100 { background-color: #202027 !important; }
        html.dark .bg-gray-200 { background-color: #26262e !important; }
        html.dark .bg-gray-300 { background-color: #303038 !important; }
        html.dark .bg-indigo-50 { background-color: #2b2b3d !important; }
        html.dark .bg-indigo-50\/30 { background-color: rgba(43, 43, 61, 0.6) !important; }
        html.dark .bg-indigo-100 { background-color: #35354a !important; }
        html.dark .file\:bg-indigo-50 { background-color: #2b2b3d !important; }
        html.dark .file\:text-indigo-700 { color: #a5b4fc !important; }
        html.dark .text-gray-900 { color: #e8e8ea !important; }
        html.dark .text-gray-800 { color: #d6d6da !important; }
        html.dark .text-gray-700 { color: #c2c2c8 !important; }
        html.dark .text-gray-600 { color: #a3a3ac !important; }
        html.dark .text-gray-500 { color: #83838d !important; }
        html.dark .text-gray-400 { color: #63636e !important; }
        html.dark .text-gray-300 { color: #4c4c56 !important; }
        html.dark .text-indigo-600, html.dark .text-indigo-500 { color: #a5b4fc !important; }
        html.dark .text-indigo-700 { color: #93a0f7 !important; }
        html.dark .text-indigo-800 { color: #b1c0ff !important; }
        html.dark .text-red-600 { color: #f87171 !important; }
        html.dark .text-green-600 { color: #4ade80 !important; }
        html.dark .border-gray-100 { border-color: #232329 !important; }
        html.dark .border-gray-200 { border-color: #2d2d34 !important; }
        html.dark .border-gray-300 { border-color: #3b3b45 !important; }
        html.dark .border-gray-400 { border-color: #4b4b57 !important; }
        html.dark .border-indigo-200 { border-color: #3c3c55 !important; }
        html.dark .placeholder-gray-400::placeholder { color: #63636e !important; }
        html.dark .hover\:bg-gray-50:hover { background-color: #202027 !important; }
        html.dark .hover\:bg-red-50:hover { background-color: rgba(127, 29, 29, 0.35) !important; }
    </style>
    <script>
        (function() {
            // Light/dark theme: saved choice wins, otherwise follow the OS.
            var savedTheme = null;
            try { savedTheme = localStorage.getItem('theme'); } catch (e) {}
            var dark = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (dark) document.documentElement.classList.add('dark');
        })();
        function clearAuth() {
            try { localStorage.removeItem('token'); } catch (e) {}
            try { localStorage.removeItem('refresh_token'); } catch (e) {}
            try { localStorage.removeItem('user'); } catch (e) {}
        }
        (function() {
            var token = null;
            try { token = localStorage.getItem('token'); } catch (e) {}
            if (!token) { window.location.href = '/login'; return; }
            try {
                var payload = JSON.parse(atob(token.split('.')[1]));
                var now = Math.floor(Date.now() / 1000);
                if (payload.exp && payload.exp < now) {
                    // The refresh token lives in an httpOnly cookie set by the
                    // server; refresh without a body and never persist it in
                    // JS-accessible storage where an XSS could exfiltrate it.
                    fetch('/auth/refresh', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' })
                        .then(function(r) { if (!r.ok) { clearAuth(); window.location.href = '/login'; return null; } return r.json(); })
                        .then(function(d) { if (d) { try { localStorage.setItem('token', d.access_token); localStorage.setItem('user', JSON.stringify(d.user)); } catch (e) {} } })
                        .catch(function() { clearAuth(); window.location.href = '/login'; });
                }
            } catch(e) { clearAuth(); window.location.href = '/login'; }
        })();
        function sidebar() {
            var u = null;
            try { u = JSON.parse(localStorage.getItem('user') || 'null'); } catch (e) { u = null; }
            return {
                user: u,
                userName: u ? u.username : '',
                userEmail: u ? u.email : '',
                userInitial: u && u.username ? u.username.charAt(0).toUpperCase() : '?',
                active: function(p) { return window.location.pathname === p; },
                logout: function() {
                    // Revoke the server-side session (httpOnly refresh cookie) if possible.
                    try { fetch('/auth/logout', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' }); } catch (e) {}
                    clearAuth();
                    window.location.href = '/login';
                },
                themeDark: document.documentElement.classList.contains('dark'),
                toggleTheme: function() {
                    this.themeDark = !this.themeDark;
                    document.documentElement.classList.toggle('dark', this.themeDark);
                    try { localStorage.setItem('theme', this.themeDark ? 'dark' : 'light'); } catch (e) {}
                },
                sidebarOpen: false,
                toggleSidebar: function() { this.sidebarOpen = !this.sidebarOpen; },
                closeSidebar: function() { this.sidebarOpen = false; }
            };
        }
        function fmtBytes(b) {
            var n = Number(b);
            if (!Number.isFinite(n) || n <= 0) return '0 B';
            var u = ['B','KB','MB','GB','TB'];
            var i = Math.min(Math.floor(Math.log(n) / Math.log(1024)), u.length - 1);
            return (n / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + u[i];
        }
        function fmtDate(iso) {
            var d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }
        function dashboard() {
            return {
                loading: true,
                error: '',
                totalFiles: 0,
                storageUsed: 0,
                duplicatesSaved: 0,
                quotaBytes: 0,
                recentFiles: [],
                storageFmt: '0 B',
                quotaFmt: '0 B',
                init: function() {
                    var self = this;
                    var token = null;
                    try { token = localStorage.getItem('token'); } catch (e) {}
                    fetch('/api/dashboard/stats', {
                        headers: { 'Authorization': 'Bearer ' + (token || '') }
                    }).then(function(r) {
                        if (r.status === 401) { clearAuth(); window.location.href = '/login'; return null; }
                        return r.ok ? r.json() : null;
                    }).then(function(d) {
                        self.loading = false;
                        if (!d) { self.error = 'Could not load dashboard data.'; return; }
                        self.totalFiles = d.total_files || 0;
                        self.storageUsed = d.storage_used || 0;
                        self.duplicatesSaved = d.duplicates_saved || 0;
                        self.quotaBytes = d.quota_bytes || 0;
                        self.storageFmt = fmtBytes(self.storageUsed);
                        self.quotaFmt = fmtBytes(self.quotaBytes);
                        self.recentFiles = Array.isArray(d.recent_files) ? d.recent_files : [];
                    }).catch(function() {
                        self.loading = false;
                        self.error = 'Could not load dashboard data.';
                    });
                }
            };
        }
    </script>
</head>
<body class="h-full bg-gray-50">
    <div class="flex h-full" x-data="sidebar()" x-on:keydown.escape.window="closeSidebar()">
        <div x-show="sidebarOpen" x-cloak class="fixed inset-0 z-30 bg-black/40 lg:hidden" x-on:click="closeSidebar()" style="display:none;"></div>
        <aside class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-gray-200 flex flex-col shrink-0 transition-transform duration-200 ease-in-out lg:static lg:translate-x-0"
            :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
            <div class="p-6 border-b border-gray-200">
                <h1 class="flex items-center gap-2 text-xl font-bold text-gray-900"><img src="/logo.svg" alt="Keystone logo" class="w-7 h-7 shrink-0">Keystone</h1>
            </div>
            <nav class="flex-1 p-4 space-y-1">
                <a href="/" x-on:click="closeSidebar()" :class="active('/') ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-gray-600 hover:bg-gray-50'" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Dashboard
                </a>
                <a href="/files" x-on:click="closeSidebar()" :class="active('/files') ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-gray-600 hover:bg-gray-50'" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                    Files
                </a>
                <a href="/account" x-on:click="closeSidebar()" :class="active('/account') ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-gray-600 hover:bg-gray-50'" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    Account
                </a>
                    <a href="/bots" x-on:click="closeSidebar()" :class="active('/bots') ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-gray-600 hover:bg-gray-50'" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9z"/></svg>
                        Bots
                    </a>
                <template x-if="user && user.role === 'admin'">
                    <a href="/admin?page=overview" x-on:click="closeSidebar()" :class="active('/admin') ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-gray-600 hover:bg-gray-50'" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        Admin
                    </a>
                </template>
                <template x-if="user && user.role === 'admin'">
                    <a href="/docs" x-on:click="closeSidebar()" :class="active('/docs') ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-gray-600 hover:bg-gray-50'" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                        Documentation
                    </a>
                </template>
            </nav>
            <div class="p-4 border-t border-gray-200 space-y-3">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-700 font-medium text-sm" x-text="userInitial"></div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-gray-900 truncate" x-text="userName"></p>
                        <p class="text-xs text-gray-400 truncate" x-text="userEmail"></p>
                    </div>
                </div>
                <div class="flex items-center justify-between px-1">
                    <span class="text-sm text-gray-600 flex items-center gap-2">
                        <svg x-show="!themeDark" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                        <svg x-show="themeDark" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                        <span x-text="themeDark ? 'Dark mode' : 'Light mode'"></span>
                    </span>
                    <button x-on:click="toggleTheme()" role="switch" :aria-checked="themeDark"
                        :class="themeDark ? 'bg-indigo-600' : 'bg-gray-300'"
                        class="relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none">
                        <span :class="themeDark ? 'translate-x-4' : 'translate-x-0'"
                            class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
                    </button>
                </div>
                <button x-on:click="closeSidebar(); logout()" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-red-600 hover:bg-red-50 transition">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Sign Out
                </button>
                <div class="px-1 pt-1 text-xs text-gray-400">Keystone v__KEYSTONE_VERSION__</div>
            </div>
        </aside>
        <main class="flex-1 overflow-auto">
            <div class="lg:hidden flex items-center gap-3 px-4 py-3 bg-white border-b border-gray-200 shrink-0">
                <button x-on:click="toggleSidebar()" class="p-2 -ml-2 rounded-lg text-gray-600 hover:bg-gray-100 transition" aria-label="Toggle navigation menu">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <span class="text-base font-semibold text-gray-900">Dashboard</span>
            </div>
            <div class="p-4 sm:p-8" x-data="dashboard()" x-init="init()">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Dashboard</h2>
                <p class="text-sm text-red-600 mb-4" x-show="error" x-text="error"></p>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <p class="text-sm text-gray-500">Total Files</p>
                        <p class="text-3xl font-bold text-gray-900 mt-1" x-text="totalFiles.toLocaleString()">0</p>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <p class="text-sm text-gray-500">Storage Used</p>
                        <p class="text-3xl font-bold text-gray-900 mt-1" x-text="storageFmt">0 B</p>
                        <p class="text-xs text-gray-400 mt-1" x-show="quotaBytes > 0" x-text="'of ' + quotaFmt + ' quota'">of 0 B quota</p>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <p class="text-sm text-gray-500">Duplicates Saved</p>
                        <p class="text-3xl font-bold text-green-600 mt-1" x-text="fmtBytes(duplicatesSaved)">0 B</p>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">Recent Files</h3>
                    <p class="text-sm text-gray-400 py-4" x-show="loading">Loading…</p>
                    <template x-if="!loading && recentFiles.length === 0">
                        <div class="text-center py-12 text-gray-400">
                            <p>No files uploaded yet</p>
                            <a href="/files" class="mt-4 inline-block text-indigo-600 hover:text-indigo-500 text-sm font-medium">Browse files</a>
                        </div>
                    </template>
                    <template x-if="recentFiles.length > 0">
                        <ul class="divide-y divide-gray-100">
                            <template x-for="f in recentFiles" :key="f.user_file_id">
                                <li class="flex items-center gap-3 py-3">
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-medium text-gray-900 truncate" x-text="f.name"></p>
                                        <p class="text-xs text-gray-400 truncate" x-text="(f.bucket_name || 'My files') + ' · ' + fmtDate(f.created_at)"></p>
                                    </div>
                                    <span class="text-sm text-gray-500 shrink-0" x-text="fmtBytes(f.size)"></span>
                                </li>
                            </template>
                        </ul>
                    </template>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
