<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Keystone</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <script defer src="/static/vendor/alpine.min.js"></script>
    <script src="/static/vendor/tailwind.min.js"></script>
    <script>
        // Theme boot: respect the user's in-app choice; fall back to OS preference.
        (function() {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="/static/app-theme.css?v=__KEYSTONE_VERSION__">
    <script>
        (function() { var t = null; try { t = localStorage.getItem('token'); } catch (e) {} if (t) window.location.href = '/'; })();

        // Cloudflare Turnstile site key, injected by the server. Empty when no
        // captcha is configured, which keeps the widget out of the page entirely.
        var TURNSTILE_SITE_KEY = "__TURNSTILE_SITE_KEY__";

        // Captcha state. Turnstile tokens are single-use, so the widget is
        // reset after every rejected attempt.
        var captcha = {
            enabled: !!TURNSTILE_SITE_KEY,
            solved: false,
            widgetId: null
        };

        function setSubmitEnabled(enabled) {
            var btn = document.getElementById('submit-btn');
            if (btn) btn.disabled = !enabled;
        }

        function captchaToken() {
            var el = document.getElementById('captcha-token');
            return el ? el.value : '';
        }

        function showError(message) {
            var errEl = document.getElementById('error-msg');
            if (errEl) errEl.textContent = message;
        }

        function onCaptchaSolved(token) {
            captcha.solved = true;
            var el = document.getElementById('captcha-token');
            if (el) el.value = token || '';
            setSubmitEnabled(true);
        }

        function onCaptchaInvalid() {
            captcha.solved = false;
            var el = document.getElementById('captcha-token');
            if (el) el.value = '';
            setSubmitEnabled(!captcha.enabled);
        }

        function resetCaptcha() {
            if (!captcha.enabled) return;
            if (captcha.widgetId === null || typeof window.turnstile === 'undefined') {
                setSubmitEnabled(true);
                showError('The verification challenge is no longer available. Please reload the page and try again.');
                return;
            }
            window.turnstile.reset(captcha.widgetId);
        }

        function initCaptcha() {
            if (!captcha.enabled) return;
            var host = document.getElementById('captcha');
            if (host) host.style.display = 'block';
            setSubmitEnabled(false);
            try {
                captcha.widgetId = window.turnstile.render('#captcha', {
                    sitekey: TURNSTILE_SITE_KEY,
                    theme: document.documentElement.classList.contains('dark') ? 'dark' : 'light',
                    callback: onCaptchaSolved,
                    'expired-callback': onCaptchaInvalid,
                    'error-callback': onCaptchaInvalid
                });
            } catch (e) {
                setSubmitEnabled(true);
                showError('Could not load the verification challenge. Check your connection and reload.');
            }
        }

        function submitRegister(e) {
            e.preventDefault();
            var errEl = document.getElementById('error-msg');
            errEl.textContent = '';
            if (captcha.enabled && !captcha.solved) {
                errEl.textContent = 'Please complete the verification challenge.';
                return;
            }
            var body = JSON.stringify({
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                captcha_token: captcha.enabled ? captchaToken() : null
            });
            setSubmitEnabled(false);
            fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: body
            }).then(function(res) {
                if (res.ok) {
                    return res.json().then(function(data) {
                        try {
                            // The refresh token is stored by the server in an
                            // httpOnly cookie; it must never live in JS-accessible
                            // storage where an XSS could exfiltrate it.
                            localStorage.setItem('token', data.access_token);
                            localStorage.setItem('user', JSON.stringify(data.user));
                        } catch (e) {
                            onCaptchaInvalid();
                            errEl.textContent = 'Account created, but could not save your session (storage is blocked, e.g. private browsing). Please sign in.';
                            return;
                        }
                        window.location.href = '/';
                    });
                }
                // The token is single-use, so the widget must be re-solved
                // before another attempt.
                onCaptchaInvalid();
                resetCaptcha();
                return res.json().then(function(data) {
                    errEl.textContent = data.message || data.error || 'Registration failed';
                });
            }).catch(function() {
                onCaptchaInvalid();
                resetCaptcha();
                errEl.textContent = 'Network error';
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (captcha.enabled) {
                var s = document.createElement('script');
                s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad';
                s.async = true;
                s.defer = true;
                // If the script never loads (blocked, offline), onload never
                // fires — re-enable the button so the attempt explains itself.
                s.onerror = function() {
                    setSubmitEnabled(true);
                    showError('Could not load the verification challenge. Check your connection and reload.');
                };
                document.head.appendChild(s);
            }
        });

        // Global callback invoked by the Turnstile script once it is ready.
        function onTurnstileLoad() {
            initCaptcha();
        }
    </script>
</head>
<body class="h-full bg-gray-50 flex items-center justify-center">
    <div class="w-full max-w-md mx-4 p-6 sm:p-8 bg-white rounded-xl shadow-lg">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Keystone</h1>
            <p class="text-gray-500 mt-1">Create your account</p>
        </div>
        <form onsubmit="submitRegister(event)" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username"
                    class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 px-3 py-2 border">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email"
                    class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 px-3 py-2 border">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password"
                    class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 px-3 py-2 border">
            </div>
            <div id="error-msg" class="text-red-600 text-sm"></div>
            <div id="captcha" style="display: none;"></div>
            <input type="hidden" id="captcha-token" name="captcha_token" value="">
            <button type="submit" id="submit-btn"
                class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 transition font-medium disabled:opacity-50 disabled:cursor-not-allowed">
                Create Account
            </button>
        </form>
        <div class="mt-6 text-center text-sm text-gray-500">
            <a href="/login" class="text-indigo-600 hover:text-indigo-500">Already have an account? Sign in</a>
        </div>
    </div>
</body>
</html>
