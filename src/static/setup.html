<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup - Keystone</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <script defer src="/static/vendor/alpine.min.js"></script>
    <script src="/static/vendor/tailwind.min.js"></script>
    <script>
        // Theme boot: respect the user's in-app choice; fall back to OS preference.
        (function() {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="/static/app-theme.css?v=__KEYSTONE_VERSION__">
    <script>
        // Setup page: only shown when no users exist. No token check needed
        // — server redirects to /setup automatically if no users exist.
        function submitSetup(e) {
            e.preventDefault();
            var errEl = document.getElementById('error-msg');
            errEl.textContent = '';
            var body = JSON.stringify({
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });
            fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: body
            }).then(function(res) {
                if (res.ok) {
                    return res.json().then(function(data) {
                        try {
                            // The refresh token is stored by the server in an
                            // httpOnly cookie; it must never live in JS-accessible
                            // storage where an XSS could exfiltrate it.
                            localStorage.setItem('token', data.access_token);
                            localStorage.setItem('user', JSON.stringify(data.user));
                        } catch (e) {
                            errEl.textContent = 'Account created, but could not save your session (storage is blocked, e.g. private browsing). Please sign in.';
                            return;
                        }
                        window.location.href = '/';
                    });
                } else {
                    return res.json().then(function(data) {
                        errEl.textContent = data.message || data.error || 'Registration failed';
                    });
                }
            }).catch(function() {
                errEl.textContent = 'Network error';
            });
        }
    </script>
</head>
<body class="h-full bg-gray-50 flex items-center justify-center">
    <div class="w-full max-w-lg mx-4 p-6 sm:p-10 bg-white rounded-2xl shadow-lg">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Keystone</h1>
            <p class="text-gray-500 mt-2">No users found. Create the first admin account to get started.</p>
        </div>
        <form onsubmit="submitSetup(event)" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username"
                    class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email"
                    class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password"
                    class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm">
                <p class="text-xs text-gray-400 mt-1">Minimum 8 characters</p>
            </div>
            <div id="error-msg" class="text-red-600 text-sm"></div>
            <button type="submit"
                class="w-full bg-indigo-600 text-white py-2.5 px-4 rounded-lg hover:bg-indigo-700 transition font-medium text-sm">
                Create Admin Account
            </button>
        </form>
    </div>
</body>
</html>
