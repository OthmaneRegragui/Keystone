<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Keystone</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <script defer src="/static/vendor/alpine.min.js"></script>
    <script src="/static/vendor/tailwind.min.js"></script>
    <link rel="stylesheet" href="/static/app-theme.css?v=__KEYSTONE_VERSION__">
    <script>
        (function() {
            // Light/dark theme: saved choice wins, otherwise follow the OS.
            var savedTheme = null;
            try { savedTheme = localStorage.getItem('theme'); } catch (e) {}
            var dark = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (dark) document.documentElement.classList.add('dark');
        })();
        function clearAuth() {
            try { localStorage.removeItem('token'); } catch (e) {}
            try { localStorage.removeItem('refresh_token'); } catch (e) {}
            try { localStorage.removeItem('user'); } catch (e) {}
        }
        (function() {
            var token = null;
            try { token = localStorage.getItem('token'); } catch (e) {}
            if (!token) { window.location.href = '/login'; return; }
            try {
                var payload = JSON.parse(atob(token.split('.')[1]));
                var now = Math.floor(Date.now() / 1000);
                if (payload.exp && payload.exp < now) {
                    // The refresh token lives in an httpOnly cookie set by the
                    // server; refresh without a body and never persist it in
                    // JS-accessible storage where an XSS could exfiltrate it.
                    fetch('/auth/refresh', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' })
                        .then(function(r) { if (!r.ok) { clearAuth(); window.location.href = '/login'; return null; } return r.json(); })
                        .then(function(d) { if (d) { try { localStorage.setItem('token', d.access_token); localStorage.setItem('user', JSON.stringify(d.user)); } catch (e) {} } })
                        .catch(function() { clearAuth(); window.location.href = '/login'; });
                }
            } catch(e) { clearAuth(); window.location.href = '/login'; }
        })();
        function sidebar() {
            var u = null;
            try { u = JSON.parse(localStorage.getItem('user') || 'null'); } catch (e) { u = null; }
            return {
                user: u,
                userName: u ? u.username : '',
                userEmail: u ? u.email : '',
                userInitial: u && u.username ? u.username.charAt(0).toUpperCase() : '?',
                active: function(p) { return window.location.pathname === p; },
                logout: function() {
                    // Revoke the server-side session (httpOnly refresh cookie) if possible.
                    try { fetch('/auth/logout', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' }); } catch (e) {}
                    clearAuth();
                    window.location.href = '/login';
                },
                themeDark: document.documentElement.classList.contains('dark'),
                toggleTheme: function() {
                    this.themeDark = !this.themeDark;
                    document.documentElement.classList.toggle('dark', this.themeDark);
                    try { localStorage.setItem('theme', this.themeDark ? 'dark' : 'light'); } catch (e) {}
                },
                sidebarOpen: false,
                toggleSidebar: function() { this.sidebarOpen = !this.sidebarOpen; },
                closeSidebar: function() { this.sidebarOpen = false; }
            };
        }
        function accountPage() {
            var params = new URLSearchParams(window.location.search);
            var validTabs = ['profile','security','api-key'];
            var initialTab = validTabs.indexOf(params.get('tab')) >= 0 ? params.get('tab') : 'profile';
            var u = null;
            try { u = JSON.parse(localStorage.getItem('user') || 'null'); } catch (e) { u = null; }
            return {
                tab: initialTab,
                userName: u ? u.username : '',
                userEmail: u ? u.email : '',
                storagePercent: 0,
                storageText: '0 B / No quota set',
                currentPassword: '',
                newPassword: '',
                passwordMsg: '',
                passwordOk: false,
                permissions: null,
                init: function() {
                    this.loadPermissions();
                    this.loadApiKeys();
                },
                setTab: function(t) {
                    this.tab = t;
                    var url = new URL(window.location);
                    url.searchParams.set('tab', t);
                    window.history.pushState({}, '', url);
                },
                loadPermissions: function() {
                    var self = this;
                    var token = null;
                    try { token = localStorage.getItem('token'); } catch (e) {}
                    fetch('/api/me/permissions', { headers: { 'Authorization': 'Bearer ' + token } })
                        .then(function(r) { return r.json(); })
                        .then(function(d) { self.permissions = d; })
                        .catch(function() {});
                },
                passwordChangeEnabled: function() {
                    if (this.permissions) return this.permissions.allow_password_change;
                    return true; // default to showing until loaded
                },
                changePassword: function() {
                    var self = this;
                    if (!self.currentPassword || !self.newPassword) return;
                    var token = null;
                    try { token = localStorage.getItem('token'); } catch (e) {}
                    fetch('/api/auth/change-password', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ current_password: self.currentPassword, new_password: self.newPassword })
                    }).then(function(r) {
                        if (!r.ok) return r.json().then(function(e) { throw e; });
                        return r.json();
                    }).then(function() {
                        self.passwordMsg = 'Password updated successfully.';
                        self.passwordOk = true;
                        self.currentPassword = '';
                        self.newPassword = '';
                    }).catch(function(e) {
                        self.passwordMsg = e.detail || e.error || 'Failed to update password.';
                        self.passwordOk = false;
                    });
                },
                apiKeys: [],
                apiKeyName: '',
                apiKeyExpiry: '',
                apiKeyScopes: ['files:read', 'files:write'],
                apiKeyMsg: '',
                apiKeyOk: false,
                createdKey: null,
                apiKeysEnabled: function() {
                    if (this.permissions) return this.permissions.allow_api_keys;
                    return true; // default to showing until loaded
                },
                loadApiKeys: function() {
                    var self = this;
                    var token = null;
                    try { token = localStorage.getItem('token'); } catch (e) {}
                    fetch('/api/api-keys', { headers: { 'Authorization': 'Bearer ' + token } })
                        .then(function(r) { return r.ok ? r.json() : []; })
                        .then(function(d) { self.apiKeys = d || []; })
                        .catch(function() { self.apiKeys = []; });
                },
                createApiKey: function() {
                    var self = this;
                    if (!self.apiKeyName.trim()) { self.apiKeyMsg = 'Please enter a key name.'; self.apiKeyOk = false; return; }
                    var token = null;
                    try { token = localStorage.getItem('token'); } catch (e) {}
                    fetch('/api/api-keys', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: self.apiKeyName.trim(),
                            scopes: self.apiKeyScopes,
                            expires_in_days: self.apiKeyExpiry === '' ? null : (Number(self.apiKeyExpiry) || 0)
                        })
                    }).then(function(r) {
                        if (!r.ok) return r.json().then(function(e) { throw e; });
                        return r.json();
                    }).then(function(d) {
                        self.createdKey = d;
                        self.apiKeyMsg = '';
                        self.apiKeyOk = true;
                        self.apiKeyName = '';
                        self.apiKeyExpiry = '';
                        self.loadApiKeys();
                    }).catch(function(e) {
                        self.apiKeyMsg = e.detail || e.error || 'Failed to create API key.';
                        self.apiKeyOk = false;
                    });
                },
                copyKey: function() {
                    if (this.createdKey && this.createdKey.full_key) {
                        navigator.clipboard.writeText(this.createdKey.full_key).catch(function() {});
                    }
                },
                deleteApiKey: function(id) {
                    var self = this;
                    if (!confirm('Delete this API key? Any automation using it will stop working.')) return;
                    var token = null;
                    try { token = localStorage.getItem('token'); } catch (e) {}
                    fetch('/api/api-keys/' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } })
                        .then(function(r) {
                            if (!r.ok) throw new Error('delete failed');
                            self.loadApiKeys();
                        })
                        .catch(function() {});
                },
                fmtKeyDate: function(k) {
                    var s = k.expires_at ? 'expires ' + new Date(k.expires_at).toLocaleDateString() : 'no expiry';
                    if (k.last_used_at) s = 'used ' + new Date(k.last_used_at).toLocaleDateString() + ' · ' + s;
                    return s;
                }
            };
        }
    </script>
</head>
<body class="h-full bg-gray-50">
    <!--SIDEBAR-->
        <main class="flex-1 overflow-auto" x-data="accountPage()">
            <div class="lg:hidden flex items-center gap-3 px-4 py-3 bg-white border-b border-gray-200 shrink-0">
                <button x-on:click="toggleSidebar()" class="p-2 -ml-2 rounded-lg text-gray-600 hover:bg-gray-100 transition" aria-label="Toggle navigation menu">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <span class="text-base font-semibold text-gray-900">Account Settings</span>
            </div>
            <div class="p-4 sm:p-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">Account Settings</h2>

            <!-- Tab Navigation -->
            <div class="border-b border-gray-200 mb-6">
                <div class="flex flex-wrap gap-0 -mb-px">
                    <button x-on:click="setTab('profile')" :class="tab==='profile' ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-gray-500 hover:text-gray-700'" class="px-4 py-2.5 text-sm font-medium border-b-2 -mb-px transition">Profile</button>
                    <button x-on:click="setTab('security')" :class="tab==='security' ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-gray-500 hover:text-gray-700'" class="px-4 py-2.5 text-sm font-medium border-b-2 -mb-px transition">Security</button>
                    <button x-on:click="setTab('api-key')" :class="tab==='api-key' ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-gray-500 hover:text-gray-700'" class="px-4 py-2.5 text-sm font-medium border-b-2 -mb-px transition">API Keys</button>
                </div>
            </div>

            <div class="max-w-2xl space-y-6">

                <!-- Profile Tab -->
                <div x-show="tab==='profile'" class="space-y-6">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Profile</h3>
                        <form class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                                <input type="text" x-model="userName" readonly class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-3 py-2 text-sm text-gray-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                <input type="email" x-model="userEmail" readonly class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-3 py-2 text-sm text-gray-500">
                            </div>
                        </form>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Storage</h3>
                        <div class="w-full bg-gray-200 rounded-full h-2.5">
                            <div class="bg-indigo-600 h-2.5 rounded-full" :style="'width: ' + storagePercent + '%'"></div>
                        </div>
                        <p class="text-sm text-gray-500 mt-2" x-text="storageText"></p>
                    </div>
                </div>

                <!-- Security Tab -->
                <div x-show="tab==='security'" class="space-y-6">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Change Password</h3>

                        <!-- Disabled message when setting is off -->
                        <div x-show="!passwordChangeEnabled()" class="bg-gray-50 border border-gray-200 rounded-xl p-6 text-center">
                            <svg class="w-10 h-10 mx-auto text-gray-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                            <p class="text-sm font-medium text-gray-700 mb-1">Password change is disabled</p>
                            <p class="text-xs text-gray-500">Contact an administrator to enable password changes for your account.</p>
                        </div>

                        <!-- Password change form -->
                        <form class="space-y-4" x-show="passwordChangeEnabled()" x-on:submit.prevent="changePassword()">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Current Password</label>
                                <input type="password" x-model="currentPassword" autocomplete="current-password" class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                                <input type="password" x-model="newPassword" autocomplete="new-password" class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                            </div>
                            <div x-show="passwordMsg" class="text-sm" :class="passwordOk ? 'text-green-600' : 'text-red-600'" x-text="passwordMsg"></div>
                            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
                                Update Password
                            </button>
                        </form>
                    </div>
                </div>

                <!-- API Keys Tab -->
                <div x-show="tab==='api-key'" class="space-y-6">

                    <!-- Disabled message when setting is off -->
                    <div x-show="!apiKeysEnabled()" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <div class="bg-gray-50 border border-gray-200 rounded-xl p-6 text-center">
                            <svg class="w-10 h-10 mx-auto text-gray-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                            <p class="text-sm font-medium text-gray-700 mb-1">API keys are disabled</p>
                            <p class="text-xs text-gray-500">Contact an administrator to enable API keys for your account.</p>
                        </div>
                    </div>

                    <template x-if="apiKeysEnabled()">
                        <div class="space-y-6">
                            <!-- Generated key (shown once) -->
                            <div x-show="createdKey" class="bg-white rounded-xl shadow-sm border border-green-200 p-6">
                                <p class="text-sm font-medium text-green-700 mb-1">Key created — copy it now, it won't be shown again</p>
                                <div class="flex items-center gap-2">
                                    <code class="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm break-all" x-text="createdKey.full_key"></code>
                                    <button x-on:click="copyKey()" class="px-3 py-2 rounded-lg border border-gray-200 text-sm font-medium text-gray-700 hover:bg-gray-50 transition">Copy</button>
                                </div>
                            </div>

                            <!-- Create form -->
                            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                <h3 class="text-lg font-semibold text-gray-900 mb-4">Generate API Key</h3>
                                <form class="space-y-4" x-on:submit.prevent="createApiKey()">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                                        <input type="text" x-model="apiKeyName" placeholder="e.g. CI uploads"
                                            class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Expires in (days)</label>
                                        <input type="number" min="1" max="3650" x-model="apiKeyExpiry" placeholder="never"
                                            class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Scopes</label>
                                        <div class="flex flex-wrap gap-4">
                                            <label class="flex items-center gap-2 text-sm text-gray-700"><input type="checkbox" value="files:read" x-model="apiKeyScopes" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"> files:read</label>
                                            <label class="flex items-center gap-2 text-sm text-gray-700"><input type="checkbox" value="files:write" x-model="apiKeyScopes" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"> files:write</label>
                                            <label class="flex items-center gap-2 text-sm text-gray-700"><input type="checkbox" value="files:delete" x-model="apiKeyScopes" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"> files:delete</label>
                                        </div>
                                    </div>
                                    <div x-show="apiKeyMsg" class="text-sm" :class="apiKeyOk ? 'text-green-600' : 'text-red-600'" x-text="apiKeyMsg"></div>
                                    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
                                        Generate Key
                                    </button>
                                </form>
                            </div>

                            <!-- Key list -->
                            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                <h3 class="text-lg font-semibold text-gray-900 mb-4">Your API Keys</h3>
                                <p x-show="apiKeys.length === 0" class="text-sm text-gray-500">No API keys yet.</p>
                                <div x-show="apiKeys.length > 0" class="space-y-3">
                                    <template x-for="k in apiKeys" :key="k.id">
                                        <div class="flex items-center justify-between gap-3 border border-gray-100 rounded-lg px-4 py-3">
                                            <div class="min-w-0">
                                                <p class="text-sm font-medium text-gray-800" x-text="k.name"></p>
                                                <p class="text-xs text-gray-400 font-mono" x-text="k.prefix + '…'"></p>
                                                <div class="flex flex-wrap gap-1 mt-1">
                                                    <template x-for="s in k.scopes" :key="s">
                                                        <span class="px-1.5 py-0.5 bg-gray-100 text-gray-600 rounded text-[11px] font-medium uppercase" x-text="s"></span>
                                                    </template>
                                                    <span x-show="!k.is_active" class="px-1.5 py-0.5 bg-red-100 text-red-600 rounded text-[11px] font-medium uppercase">Inactive</span>
                                                </div>
                                            </div>
                                            <div class="flex items-center gap-3 shrink-0">
                                                <span class="text-xs text-gray-400" x-text="fmtKeyDate(k)"></span>
                                                <button x-on:click="deleteApiKey(k.id)" class="text-xs font-medium text-red-600 hover:text-red-700 transition">Delete</button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

            </div>
            </div>
        </main>
    </div>
</body>
</html>
