<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared with Me - Keystone</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <script defer src="/static/vendor/alpine.min.js"></script>
    <script src="/static/vendor/tailwind.min.js"></script>
    <link rel="stylesheet" href="/static/app-theme.css?v=__KEYSTONE_VERSION__">
    <style>
        [x-cloak] { display: none !important; }
    </style>
    <script>
        (function() {
            var savedTheme = null;
            try { savedTheme = localStorage.getItem('theme'); } catch (e) {}
            var dark = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (dark) document.documentElement.classList.add('dark');
        })();
        function clearAuth() {
            try { localStorage.removeItem('token'); } catch (e) {}
            try { localStorage.removeItem('refresh_token'); } catch (e) {}
            try { localStorage.removeItem('user'); } catch (e) {}
        }
        (function() {
            var token = null;
            try { token = localStorage.getItem('token'); } catch (e) {}
            if (!token) { window.location.href = '/login'; return; }
            try {
                var payload = JSON.parse(atob(token.split('.')[1]));
                var now = Math.floor(Date.now() / 1000);
                if (payload.exp && payload.exp < now) {
                    clearAuth();
                    window.location.href = '/login';
                }
            } catch (e) { clearAuth(); window.location.href = '/login'; }
        })();
    </script>
</head>
<body class="h-full bg-gray-50">
    <!--SIDEBAR-->

        <main class="flex-1 overflow-hidden flex flex-col bg-gray-50" x-data="sharedPage()"
            x-on:keydown.escape.window="closeCtx()" x-on:click.window="closeCtx()">

            <!-- ═══ Toolbar ═══ -->
            <div class="relative z-30 bg-white border-b border-gray-200 px-4 py-2.5 shrink-0">
                <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                    <!-- Mobile sidebar toggle -->
                    <button x-on:click="toggleSidebar()" class="lg:hidden p-1.5 -ml-1.5 rounded-lg text-gray-500 hover:bg-gray-100 transition" aria-label="Toggle navigation menu">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <!-- Breadcrumb / Address Bar -->
                    <div class="flex-1 min-w-0 flex items-center gap-0.5">
                        <div class="flex items-center gap-0.5 bg-gray-50 border border-gray-200 rounded-lg px-3 py-1.5 text-sm shrink-0">
                            <svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
                            <button x-on:click="loadShared()"
                                class="px-1.5 py-0.5 rounded hover:bg-gray-200 transition font-medium text-gray-700">Shared with Me</button>
                        </div>
                        <!-- Breadcrumb path -->
                        <div class="flex items-center gap-0.5 overflow-hidden">
                            <template x-for="(bc, idx) in breadcrumbs" :key="idx">
                                <span class="flex items-center gap-0.5 shrink-0">
                                    <svg class="w-3 h-3 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                                    <button x-on:click="navigateToCrumb(bc)"
                                        class="px-1.5 py-0.5 rounded hover:bg-gray-200 transition whitespace-nowrap"
                                        :class="idx === breadcrumbs.length - 1 ? 'text-gray-900 font-medium' : 'text-gray-500 hover:text-gray-700'"
                                        x-text="bc.name"></button>
                                </span>
                            </template>
                        </div>
                    </div>

                    <!-- Toolbar Actions -->
                    <div class="flex items-center gap-1.5 shrink-0 flex-wrap">
                        <!-- View Toggle -->
                        <div class="flex items-center bg-gray-100 rounded-lg p-0.5">
                            <button x-on:click="viewMode = 'list'" :class="viewMode === 'list' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-400 hover:text-gray-600'" class="p-1.5 rounded-md transition" title="List view">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                            </button>
                            <button x-on:click="viewMode = 'grid'" :class="viewMode === 'grid' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-400 hover:text-gray-600'" class="p-1.5 rounded-md transition" title="Grid view">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/></svg>
                            </button>
                        </div>
                        <!-- Search -->
                        <div class="relative">
                            <svg class="w-4 h-4 text-gray-400 absolute left-2.5 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            <input type="text" placeholder="Search..."
                                x-model="searchInput" x-on:keydown.enter="doSearch()"
                                class="w-full sm:w-44 rounded-lg border border-gray-200 bg-gray-50 pl-8 pr-2 py-1.5 text-sm focus:bg-white focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 transition">
                        </div>
                        <div class="w-px h-6 bg-gray-200"></div>
                        <!-- Refresh -->
                        <button x-on:click="browsingFolder ? openFolder({ folder_id: currentFolderId, name: currentFolderName }) : loadShared()"
                            class="p-1.5 rounded-lg text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition" title="Refresh">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="flex-1 overflow-auto" x-on:scroll.capture="closeCtx()">

                <!-- Loading -->
                <div x-show="loading" class="p-12 text-center text-gray-400">
                    <svg class="w-6 h-6 mx-auto mb-2 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                    <p class="text-sm">Loading...</p>
                </div>

                <!-- Empty State -->
                <div x-show="!loading && filteredFolders().length === 0 && filteredFiles().length === 0 && !(browsingFolder && breadcrumbs.length > 1)" class="h-full flex items-center justify-center text-gray-400">
                    <div class="text-center">
                        <svg class="w-16 h-16 mx-auto mb-3 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
                        <template x-if="browsingFolder">
                            <div>
                                <p x-show="filteredFolders().length === 0 && filteredFiles().length === 0 && (currentFolders.length > 0 || currentFiles.length > 0)" class="font-medium text-gray-600 mb-1">No items match your search</p>
                                <p x-show="currentFolders.length === 0 && currentFiles.length === 0" class="font-medium text-gray-600 mb-1">This folder is empty</p>
                            </div>
                        </template>
                        <template x-if="!browsingFolder">
                            <div>
                                <p x-show="allFolders.length === 0 && allFiles.length === 0" class="font-medium text-gray-600 mb-1">No shared items</p>
                                <p x-show="allFolders.length === 0 && allFiles.length === 0" class="text-sm text-gray-400">Files and folders shared with you will appear here</p>
                                <p x-show="allFolders.length > 0 || allFiles.length > 0" class="font-medium text-gray-600 mb-1">No items match your search</p>
                                <a x-show="allFolders.length === 0 && allFiles.length === 0" href="/files" class="mt-6 inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                                    Browse Files
                                </a>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- LIST VIEW -->
                <div x-show="!loading && viewMode === 'list' && (filteredFolders().length > 0 || filteredFiles().length > 0 || (browsingFolder && breadcrumbs.length > 1))">
                    <!-- Folders section -->
                    <div x-show="filteredFolders().length > 0 || (browsingFolder && breadcrumbs.length > 1)">
                        <div class="px-4 py-2 bg-gray-50 border-b border-gray-200">
                            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Folders</h3>
                        </div>
                        <table class="w-full text-sm">
                            <thead class="sticky top-0 z-10 bg-gray-50 border-b border-gray-200">
                                <tr class="text-left text-gray-500">
                                    <th class="px-4 py-2 font-medium w-[35%]">Name</th>
                                    <th class="px-4 py-2 font-medium w-[20%] hidden md:table-cell">Bucket</th>
                                    <th class="px-4 py-2 font-medium w-[25%] hidden md:table-cell">Shared by</th>
                                    <th class="px-4 py-2 font-medium w-[20%] hidden md:table-cell">Shared at</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                <template x-if="browsingFolder && breadcrumbs.length > 1">
                                    <tr class="hover:bg-indigo-50/50 group transition-colors cursor-pointer"
                                        x-on:dblclick.prevent="goBack()">
                                        <td class="px-4 py-2.5">
                                            <div class="flex items-center gap-3">
                                                <svg class="w-5 h-5 text-gray-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                                                <span class="font-medium text-gray-500">..</span>
                                            </div>
                                        </td>
                                        <td class="px-4 py-2.5 hidden md:table-cell"></td>
                                        <td class="px-4 py-2.5 hidden md:table-cell"></td>
                                        <td class="px-4 py-2.5 hidden md:table-cell"></td>
                                    </tr>
                                </template>
                                <template x-for="f in filteredFolders()" :key="'sf-'+f.share_id">
                                    <tr class="hover:bg-indigo-50/50 group transition-colors"
                                        x-on:dblclick.prevent="openFolder({ folder_id: f.folder_id || f.id, name: f.name })"
                                        x-on:contextmenu.prevent="openCtx($event, 'folder', f)">
                                        <td class="px-4 py-2.5">
                                            <div class="flex items-center gap-3">
                                                <svg class="w-5 h-5 text-amber-500 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
                                                <span class="font-medium text-gray-900 truncate" x-text="f.name"></span>
                                            </div>
                                        </td>
                                        <td class="px-4 py-2.5 text-gray-500 text-xs hidden md:table-cell" x-text="f.bucket_name"></td>
                                        <td class="px-4 py-2.5 text-gray-500 text-xs hidden md:table-cell">
                                            <span class="inline-flex items-center gap-1">
                                                <span class="w-5 h-5 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-700 text-[10px] font-medium" x-text="f.shared_by_username ? f.shared_by_username.charAt(0).toUpperCase() : '?'"></span>
                                                <span x-text="f.shared_by_username"></span>
                                            </span>
                                        </td>
                                        <td class="px-4 py-2.5 text-gray-400 text-xs hidden md:table-cell" x-text="formatDate(f.shared_at)"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- Files section -->
                    <div x-show="filteredFiles().length > 0">
                        <div class="px-4 py-2 bg-gray-50 border-b border-gray-200">
                            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Files</h3>
                        </div>
                        <table class="w-full text-sm">
                            <thead class="sticky top-0 z-10 bg-gray-50 border-b border-gray-200">
                                <tr class="text-left text-gray-500">
                                    <th class="px-4 py-2 font-medium w-[35%]">Name</th>
                                    <th class="px-4 py-2 font-medium w-[10%] hidden md:table-cell">Size</th>
                                    <th class="px-4 py-2 font-medium w-[15%] hidden md:table-cell">Bucket</th>
                                    <th class="px-4 py-2 font-medium w-[20%] hidden md:table-cell">Shared by</th>
                                    <th class="px-4 py-2 font-medium w-[20%] hidden md:table-cell">Shared at</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                <template x-for="f in filteredFiles()" :key="'sff-'+f.share_id">
                                    <tr class="hover:bg-indigo-50/50 group transition-colors"
                                        x-on:contextmenu.prevent="openCtx($event, 'file', f)">
                                        <td class="px-4 py-2.5">
                                            <div class="flex items-center gap-3">
                                                <div class="w-7 h-7 rounded flex items-center justify-center text-[10px] font-bold shrink-0"
                                                    :class="{
                                                        'bg-blue-100 text-blue-600': fileIcon(f.mime_type) === 'image',
                                                        'bg-purple-100 text-purple-600': fileIcon(f.mime_type) === 'video',
                                                        'bg-green-100 text-green-600': fileIcon(f.mime_type) === 'text',
                                                        'bg-red-100 text-red-600': fileIcon(f.mime_type) === 'pdf',
                                                        'bg-yellow-100 text-yellow-600': fileIcon(f.mime_type) === 'archive',
                                                        'bg-gray-100 text-gray-500': fileIcon(f.mime_type) === 'file' || fileIcon(f.mime_type) === 'audio'
                                                    }">
                                                    <span x-text="fileExtTag(f.name, 3)"></span>
                                                </div>
                                                <span class="font-medium text-gray-900 truncate" x-text="f.name"></span>
                                            </div>
                                        </td>
                                        <td class="px-4 py-2.5 text-gray-400 text-xs hidden md:table-cell" x-text="fmtBytes(f.size)"></td>
                                        <td class="px-4 py-2.5 text-gray-500 text-xs hidden md:table-cell" x-text="f.bucket_name || 'default'"></td>
                                        <td class="px-4 py-2.5 text-gray-500 text-xs hidden md:table-cell">
                                            <span class="inline-flex items-center gap-1">
                                                <span class="w-5 h-5 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-700 text-[10px] font-medium" x-text="f.shared_by_username ? f.shared_by_username.charAt(0).toUpperCase() : '?'"></span>
                                                <span x-text="f.shared_by_username"></span>
                                            </span>
                                        </td>
                                        <td class="px-4 py-2.5 text-gray-400 text-xs hidden md:table-cell" x-text="formatDate(f.shared_at)"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- GRID VIEW -->
                <div x-show="!loading && viewMode === 'grid' && (filteredFolders().length > 0 || filteredFiles().length > 0 || (browsingFolder && breadcrumbs.length > 1))" class="p-6">
                    <div x-show="filteredFolders().length > 0 || (browsingFolder && breadcrumbs.length > 1)" class="mb-6">
                        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Folders</h3>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
                            <template x-if="browsingFolder && breadcrumbs.length > 1">
                                <div class="group bg-white rounded-xl border border-gray-200 p-4 hover:border-indigo-300 hover:shadow-sm transition cursor-pointer relative"
                                    x-on:dblclick.prevent="goBack()">
                                    <div class="flex flex-col items-center text-center">
                                        <svg class="w-10 h-10 text-gray-300 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                                        <p class="text-sm font-medium text-gray-500">..</p>
                                    </div>
                                </div>
                            </template>
                            <template x-for="f in filteredFolders()" :key="'gsf-'+f.share_id">
                                <div class="group bg-white rounded-xl border border-gray-200 p-4 hover:border-indigo-300 hover:shadow-sm transition cursor-pointer relative"
                                    x-on:dblclick.prevent="openFolder({ folder_id: f.folder_id || f.id, name: f.name })"
                                    x-on:contextmenu.prevent="openCtx($event, 'folder', f)">
                                    <div class="flex flex-col items-center text-center">
                                        <svg class="w-10 h-10 text-amber-400 mb-2" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
                                        <p class="text-sm font-medium text-gray-900 truncate w-full" x-text="f.name"></p>
                                        <p class="text-xs text-gray-400 mt-1" x-text="f.bucket_name"></p>
                                        <p class="text-xs text-indigo-500 mt-1 flex items-center gap-1">
                                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                            <span x-text="f.shared_by_username"></span>
                                        </p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                    <div x-show="filteredFiles().length > 0">
                        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Files</h3>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
                            <template x-for="f in filteredFiles()" :key="'gsff-'+f.share_id">
                                <div class="group bg-white rounded-xl border border-gray-200 p-4 hover:border-indigo-300 hover:shadow-sm transition cursor-pointer relative"
                                    x-on:contextmenu.prevent="openCtx($event, 'file', f)">
                                    <div class="flex flex-col items-center text-center">
                                        <div class="w-12 h-12 rounded-lg flex items-center justify-center text-sm font-bold mb-2"
                                            :class="{
                                                'bg-blue-100 text-blue-600': fileIcon(f.mime_type) === 'image',
                                                'bg-purple-100 text-purple-600': fileIcon(f.mime_type) === 'video',
                                                'bg-green-100 text-green-600': fileIcon(f.mime_type) === 'text',
                                                'bg-red-100 text-red-600': fileIcon(f.mime_type) === 'pdf',
                                                'bg-yellow-100 text-yellow-600': fileIcon(f.mime_type) === 'archive',
                                                'bg-gray-100 text-gray-500': fileIcon(f.mime_type) === 'file' || fileIcon(f.mime_type) === 'audio'
                                            }">
                                            <span x-text="fileExtTag(f.name, 4)"></span>
                                        </div>
                                        <p class="text-sm font-medium text-gray-900 truncate w-full" x-text="f.name"></p>
                                        <p class="text-xs text-gray-400 mt-1" x-text="fmtBytes(f.size)"></p>
                                        <p class="text-xs text-indigo-500 mt-1 flex items-center gap-1">
                                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                            <span x-text="f.shared_by_username"></span>
                                        </p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Context menu -->
            <div x-show="ctxOpen" x-cloak
                class="fixed z-[70] w-48 bg-white rounded-xl shadow-xl border border-gray-200 py-1.5"
                :style="'left:' + ctxX + 'px; top:' + ctxY + 'px;'"
                x-on:contextmenu.prevent>
                <template x-if="ctxItem">
                    <div>
                        <div class="px-3 py-1.5 text-xs font-medium text-gray-400 truncate border-b border-gray-100 mb-1" x-text="ctxItem.name"></div>
                        <template x-if="ctxKind === 'file'">
                            <div>
                                <button x-on:click="downloadFile(ctxItem)"
                                    class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 transition">
                                    <svg class="w-4 h-4 text-indigo-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                    Download
                                </button>
                                <div class="px-3 py-1.5 text-xs text-gray-400 border-t border-gray-100 mt-1 pt-2">
                                    Shared by <span class="font-medium text-gray-600" x-text="ctxItem.shared_by_username"></span>
                                </div>
                            </div>
                        </template>
                        <template x-if="ctxKind === 'folder'">
                            <div>
                                <button x-on:click="openFolder({ folder_id: ctxItem.folder_id || ctxItem.id, name: ctxItem.name }); closeCtx()"
                                    class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 transition">
                                    <svg class="w-4 h-4 text-indigo-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                                    Open
                                </button>
                                <div class="px-3 py-1.5 text-xs text-gray-400 border-t border-gray-100 mt-1 pt-2">
                                    Shared by <span class="font-medium text-gray-600" x-text="ctxItem.shared_by_username"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Toast -->
            <div x-show="toast" x-cloak x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0"
                x-transition:leave="transition ease-in duration-200"
                x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 translate-y-4"
                class="fixed bottom-6 right-6 z-50 bg-gray-900 text-white px-4 py-3 rounded-lg shadow-lg text-sm flex items-center gap-2"
                style="display:none;">
                <svg x-show="toastType === 'success'" class="w-4 h-4 text-green-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                <svg x-show="toastType === 'error'" class="w-4 h-4 text-red-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                <span x-text="toastMsg"></span>
            </div>
        </main>
    </div>

    <script>
        function sidebar() {
            var u = null;
            try { u = JSON.parse(localStorage.getItem('user') || 'null'); } catch (e) { u = null; }
            return {
                user: u,
                userName: u ? u.username : '',
                userEmail: u ? u.email : '',
                userInitial: u && u.username ? u.username.charAt(0).toUpperCase() : '?',
                active: function(p) { return window.location.pathname === p; },
                logout: function() {
                    try { fetch('/auth/logout', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' }); } catch (e) {}
                    clearAuth();
                    window.location.href = '/login';
                },
                themeDark: document.documentElement.classList.contains('dark'),
                toggleTheme: function() {
                    this.themeDark = !this.themeDark;
                    document.documentElement.classList.toggle('dark', this.themeDark);
                    try { localStorage.setItem('theme', this.themeDark ? 'dark' : 'light'); } catch (e) {}
                },
                sidebarOpen: false,
                toggleSidebar: function() { this.sidebarOpen = !this.sidebarOpen; },
                closeSidebar: function() { this.sidebarOpen = false; }
            };
        }

        function fmtBytes(b) {
            var n = Number(b);
            if (!Number.isFinite(n) || n <= 0) return '0 B';
            var u = ['B','KB','MB','GB','TB'];
            var i = Math.min(Math.floor(Math.log(n) / Math.log(1024)), u.length - 1);
            return (n / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + u[i];
        }

        function sharedPage() {
            return {
                loading: true,
                allFolders: [],
                allFiles: [],
                viewMode: 'list',
                searchInput: '',
                search: '',
                toast: false,
                toastMsg: '',
                toastType: 'success',
                ctxOpen: false,
                ctxX: 0,
                ctxY: 0,
                ctxKind: 'file',
                ctxItem: null,
                /* folder navigation */
                breadcrumbs: [],
                currentFolderId: null,
                currentFolderName: '',
                currentFolders: [],
                currentFiles: [],
                browsingFolder: false,
                init: function() { this.loadShared(); },
                authFetch: function(url, opts) {
                    var token = null;
                    try { token = localStorage.getItem('token'); } catch (e) {}
                    opts = opts || {};
                    opts.headers = Object.assign(opts.headers || {}, { 'Authorization': 'Bearer ' + token });
                    return fetch(url, opts).then(function(res) {
                        if (res.status === 401) { clearAuth(); window.location.href = '/login'; }
                        return res;
                    });
                },
                loadShared: function() {
                    var self = this;
                    self.loading = true;
                    self.browsingFolder = false;
                    self.currentFolderId = null;
                    self.currentFolders = [];
                    self.currentFiles = [];
                    self.authFetch('/api/shared')
                        .then(function(r) { return r.json(); })
                        .then(function(d) {
                            self.allFolders = d.folders || [];
                            self.allFiles = d.files || [];
                            self.loading = false;
                        })
                        .catch(function() { self.loading = false; });
                },
                openFolder: function(f) {
                    var self = this;
                    self.loading = true;
                    self.browsingFolder = true;
                    self.currentFolderId = f.folder_id || f.id;
                    self.currentFolderName = f.name;
                    self.authFetch('/api/shared/folder/' + self.currentFolderId + '/contents')
                        .then(function(r) { return r.json(); })
                        .then(function(d) {
                            self.currentFolders = d.folders || [];
                            self.currentFiles = d.files || [];
                            self.breadcrumbs = d.path || [];
                            self.loading = false;
                        })
                        .catch(function() {
                            self.loading = false;
                            self.showToast('Failed to open folder', 'error');
                        });
                },
                goBack: function() {
                    if (this.breadcrumbs.length > 1) {
                        var prev = this.breadcrumbs[this.breadcrumbs.length - 2];
                        if (prev.id === null) {
                            this.loadShared();
                        } else {
                            var name = prev.name;
                            this.openFolder({ folder_id: prev.id, name: name });
                        }
                    } else {
                        this.loadShared();
                    }
                },
                navigateToCrumb: function(crumb) {
                    if (crumb.id === null) {
                        this.loadShared();
                    } else {
                        this.openFolder({ folder_id: crumb.id, name: crumb.name });
                    }
                },
                filteredFolders: function() {
                    var self = this;
                    var list = self.browsingFolder ? self.currentFolders : self.allFolders;
                    if (self.search) {
                        var q = self.search.toLowerCase();
                        list = list.filter(function(f) { return f.name.toLowerCase().indexOf(q) !== -1; });
                    }
                    return list;
                },
                filteredFiles: function() {
                    var self = this;
                    var list = self.browsingFolder ? self.currentFiles : self.allFiles;
                    if (self.search) {
                        var q = self.search.toLowerCase();
                        list = list.filter(function(f) { return f.name.toLowerCase().indexOf(q) !== -1; });
                    }
                    return list;
                },
                filteredCount: function() {
                    return this.filteredFolders().length + this.filteredFiles().length;
                },
                doSearch: function() { this.search = this.searchInput; },
                formatDate: function(iso) {
                    if (!iso) return '';
                    var d = new Date(iso);
                    if (isNaN(d.getTime())) return '';
                    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                },
                fileIcon: function(mime) {
                    if (!mime) return 'file';
                    if (mime.startsWith('image/')) return 'image';
                    if (mime.startsWith('video/')) return 'video';
                    if (mime.startsWith('audio/')) return 'audio';
                    if (mime.includes('pdf')) return 'pdf';
                    if (mime.includes('zip') || mime.includes('tar') || mime.includes('gz') || mime.includes('rar') || mime.includes('7z')) return 'archive';
                    if (mime.includes('text') || mime.includes('json') || mime.includes('xml')) return 'text';
                    return 'file';
                },
                fileExtTag: function(name, max) {
                    if (!name) return '';
                    var parts = name.split('.');
                    if (parts.length < 2) return '';
                    var ext = parts.pop().toUpperCase();
                    return ext.substring(0, max || 3);
                },
                showToast: function(msg, type) {
                    var self = this;
                    self.toastMsg = msg;
                    self.toastType = type || 'success';
                    self.toast = true;
                    setTimeout(function() { self.toast = false; }, 3000);
                },
                openCtx: function(e, kind, item) {
                    this.ctxKind = kind;
                    this.ctxItem = item;
                    var pad = 8, w = 192, h = kind === 'file' ? 130 : 110;
                    var x = e.clientX, y = e.clientY;
                    if (x + w + pad > window.innerWidth) x = window.innerWidth - w - pad;
                    if (y + h + pad > window.innerHeight) y = window.innerHeight - h - pad;
                    this.ctxX = Math.max(pad, x);
                    this.ctxY = Math.max(pad, y);
                    this.ctxOpen = true;
                },
                closeCtx: function() { this.ctxOpen = false; },
                downloadFile: function(f) {
                    var self = this;
                    self.authFetch('/api/shared/file/' + f.user_file_id + '/download')
                        .then(function(r) {
                            if (!r.ok) throw new Error('Download failed');
                            return r.blob();
                        }).then(function(blob) {
                            var url = URL.createObjectURL(blob);
                            var a = document.createElement('a');
                            a.href = url;
                            a.download = f.name;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                            self.showToast('Downloaded "' + f.name + '"');
                        }).catch(function() { self.showToast('Download failed', 'error'); });
                    self.closeCtx();
                }
            };
        }
    </script>
</body>
</html>
