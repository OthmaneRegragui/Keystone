[package]
name = "keystone"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "keystone"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# Web framework
axum = { version = "0.7", features = ["multipart", "macros"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "set-header", "limit"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate"] }

# Auth
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

# Hashing
blake3 = "1"

# Config
config = "0.14"
dotenvy = "0.15"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Misc
futures = "0.3"
bytes = "1"
mime = "0.3"
base64 = "0.22"
strum = { version = "0.26", features = ["derive"] }
async-trait = "0.1"
walkdir = "2"
zip = { version = "2", features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
